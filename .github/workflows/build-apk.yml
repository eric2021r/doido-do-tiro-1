name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar o APK de debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # A keystore de debug precisa ser a mesma entre builds, senao o Android
      # recusa instalar por cima ("assinaturas diferentes").
      - name: Restaurar a keystore de debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Dar permissao de execucao ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar o APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/arena-fps-debug.apk
          ls -lh dist/
          sha256sum dist/arena-fps-debug.apk

      - name: Guardar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-fps-debug-apk
          path: dist/arena-fps-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Publicar numa release deixa um link direto para baixar o .apk no celular.
      - name: Publicar na release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/arena-fps-debug.apk \
            --title "APK mais recente" \
            --notes "APK de debug compilado automaticamente pelo GitHub Actions.

          Commit: ${{ github.sha }}

          Instale no celular permitindo 'instalar apps de fontes desconhecidas'." \
            --target "${{ github.sha }}"
